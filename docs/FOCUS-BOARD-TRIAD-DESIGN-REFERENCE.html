<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тріада — Простір Фокусу</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: {
                        brand: {
                            light: '#f8fafc',
                            accent: '#6366f1',
                            soft: 'rgba(255, 255, 255, 0.7)'
                        }
                    },
                    borderRadius: { '4xl': '2rem' }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #e2e8f0;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background-image 0.8s ease;
            height: 100vh;
            overflow: hidden;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.05);
        }

        .focus-glow {
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.2);
            border: 2px solid white;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }

        /* Animation for game-like feel */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0); }
        }
        .float-anim { animation: float 4s ease-in-out infinite; }

        .task-enter { animation: slideIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes slideIn {
            from { opacity: 0; transform: scale(0.9) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4 md:p-8">

    <!-- Background Switcher (Game style top right) -->
    <div class="fixed top-6 right-6 flex gap-2 z-50">
        <button onclick="changeBg('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&q=80&w=2000')" class="w-8 h-8 rounded-full border-2 border-white shadow-lg bg-emerald-200 overflow-hidden"></button>
        <button onclick="changeBg('https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?auto=format&fit=crop&q=80&w=2000')" class="w-8 h-8 rounded-full border-2 border-white shadow-lg bg-blue-200 overflow-hidden"></button>
        <button onclick="changeBg('https://images.unsplash.com/photo-1502082553048-f009c37129b9?auto=format&fit=crop&q=80&w=2000')" class="w-8 h-8 rounded-full border-2 border-white shadow-lg bg-orange-200 overflow-hidden"></button>
    </div>

    <!-- Main Game Board Container -->
    <div class="w-full max-w-7xl h-full flex flex-col gap-6 relative">
        
        <!-- Header -->
        <header class="flex justify-between items-end px-4">
            <div class="flex flex-col">
                <h1 class="text-3xl font-800 text-slate-900 tracking-tight">Доброго дня, Олександре</h1>
                <p class="text-slate-600 font-medium">Ваш фокус на сьогодні — 3 ключові цілі</p>
            </div>
            <div class="flex gap-4">
                <button class="bg-white/50 backdrop-blur-md px-6 py-3 rounded-2xl font-bold text-slate-700 hover:bg-white transition-all shadow-sm flex items-center gap-2">
                    <i data-lucide="archive" class="w-5 h-5"></i> Беклог
                </button>
            </div>
        </header>

        <!-- Dynamic Structure -->
        <div class="flex-1 grid grid-cols-12 gap-6 min-h-0">
            
            <!-- Side: Tomorrow -->
            <div class="col-span-12 lg:col-span-3 flex flex-col gap-4">
                <div class="glass-card rounded-4xl p-6 flex-1 flex flex-col min-h-0">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-bold text-slate-500 uppercase tracking-widest text-xs">Завтра</h3>
                        <span class="bg-slate-200 text-slate-600 px-2 py-0.5 rounded-lg text-[10px] font-bold">2 цілі</span>
                    </div>
                    <div class="flex-1 overflow-y-auto custom-scrollbar space-y-3" id="day-2-list">
                        <!-- Tasks -->
                    </div>
                    <button onclick="addTask(2)" class="mt-4 w-full py-3 rounded-2xl border-2 border-dashed border-slate-300 text-slate-400 font-bold hover:bg-white/50 hover:border-slate-400 transition-all text-sm flex items-center justify-center gap-2">
                        <i data-lucide="plus" class="w-4 h-4"></i> Додати
                    </button>
                </div>
            </div>

            <!-- Center: TODAY (Primary Focus Arena) -->
            <div class="col-span-12 lg:col-span-6 flex flex-col">
                <div class="glass-card rounded-[3rem] p-8 flex-1 focus-glow flex flex-col relative overflow-hidden bg-white/80">
                    <!-- Progress Bar (Top) -->
                    <div class="absolute top-0 left-0 w-full h-2 bg-slate-100">
                        <div id="today-progress" class="h-full bg-indigo-500 transition-all duration-500" style="width: 30%"></div>
                    </div>

                    <div class="flex justify-between items-start mb-8 mt-2">
                        <div>
                            <h2 class="text-4xl font-800 text-slate-900 tracking-tight flex items-center gap-3">
                                Сьогодні <span class="text-indigo-500">🔥</span>
                            </h2>
                            <p class="text-slate-500 font-semibold mt-1">Головний пріоритет: <span class="text-slate-800">Запуск MVP</span></p>
                        </div>
                        <div class="w-16 h-16 rounded-3xl bg-indigo-50 flex items-center justify-center border-2 border-white shadow-inner">
                            <span class="text-2xl font-800 text-indigo-600">3</span>
                        </div>
                    </div>

                    <!-- Today's Grid (More visual tiles) -->
                    <div class="flex-1 grid grid-cols-1 sm:grid-cols-2 gap-4 overflow-y-auto custom-scrollbar pr-2" id="day-1-list">
                        <!-- Big Cards -->
                    </div>

                    <!-- Input Bar -->
                    <div class="mt-6 flex gap-3">
                        <input id="today-input" type="text" placeholder="Що ще важливо сьогодні?" class="flex-1 bg-white border-2 border-transparent focus:border-indigo-100 rounded-3xl px-6 py-4 text-slate-800 font-medium outline-none shadow-inner transition-all">
                        <button onclick="addTask(1)" class="bg-indigo-600 text-white w-14 rounded-3xl flex items-center justify-center shadow-lg shadow-indigo-200 hover:scale-105 active:scale-95 transition-all">
                            <i data-lucide="arrow-right" class="w-6 h-6"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Side: After Tomorrow -->
            <div class="col-span-12 lg:col-span-3 flex flex-col gap-4">
                <div class="glass-card rounded-4xl p-6 flex-1 flex flex-col min-h-0">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-bold text-slate-500 uppercase tracking-widest text-xs">Післязавтра</h3>
                        <span class="bg-slate-200 text-slate-600 px-2 py-0.5 rounded-lg text-[10px] font-bold">1 ціль</span>
                    </div>
                    <div class="flex-1 overflow-y-auto custom-scrollbar space-y-3" id="day-3-list">
                        <!-- Tasks -->
                    </div>
                    <button onclick="addTask(3)" class="mt-4 w-full py-3 rounded-2xl border-2 border-dashed border-slate-300 text-slate-400 font-bold hover:bg-white/50 hover:border-slate-400 transition-all text-sm flex items-center justify-center gap-2">
                        <i data-lucide="plus" class="w-4 h-4"></i> Додати
                    </button>
                </div>
            </div>

        </div>

        <!-- Habits Hotbar (RPG style bottom panel) -->
        <footer class="flex justify-center pb-4">
            <div class="glass-card px-8 py-4 rounded-[2.5rem] flex items-center gap-6 shadow-2xl float-anim border-t-white">
                <div class="flex flex-col mr-4">
                    <span class="text-[10px] font-800 text-slate-400 uppercase tracking-widest">Rituals</span>
                    <span class="text-sm font-bold text-slate-700">Звички</span>
                </div>
                <div class="flex gap-3" id="habits-list">
                    <!-- Habits Icons -->
                </div>
                <div class="h-8 w-px bg-slate-300 mx-2"></div>
                <button class="w-10 h-10 rounded-full bg-white flex items-center justify-center text-slate-400 hover:text-indigo-500 transition-colors shadow-sm">
                    <i data-lucide="plus-circle" class="w-6 h-6"></i>
                </button>
            </div>
        </footer>

    </div>

    <script>
        let state = {
            tasks: [
                { id: 1, day: 1, text: "Продумати UX навігацію", completed: true, focus: true },
                { id: 2, day: 1, text: "Зустріч з командою", completed: false, focus: false },
                { id: 3, day: 1, text: "Фікс багів CSS", completed: false, focus: false },
                { id: 4, day: 2, text: "Підготувати презентацію", completed: false, focus: false },
                { id: 5, day: 3, text: "Аналіз конкурентів", completed: false, focus: false },
            ],
            habits: [
                { id: 1, name: "Вода", icon: "droplet", color: "text-blue-500", done: true },
                { id: 2, name: "Книга", icon: "book-open", color: "text-orange-500", done: false },
                { id: 3, name: "Медитація", icon: "wind", color: "text-purple-500", done: true },
                { id: 4, name: "Спорт", icon: "zap", color: "text-emerald-500", done: false }
            ]
        };

        function changeBg(url) {
            document.body.style.backgroundImage = `url('${url}')`;
        }

        // Initialize background
        changeBg('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&q=80&w=2000');

        function render() {
            // Render Habits
            const habitList = document.getElementById('habits-list');
            habitList.innerHTML = state.habits.map(h => `
                <button onclick="toggleHabit(${h.id})" class="group relative">
                    <div class="w-12 h-12 rounded-2xl flex items-center justify-center transition-all shadow-sm ${h.done ? 'bg-indigo-600 shadow-indigo-200' : 'bg-white hover:bg-indigo-50'}">
                        <i data-lucide="${h.icon}" class="w-6 h-6 ${h.done ? 'text-white' : h.color}"></i>
                    </div>
                    <span class="absolute -top-10 left-1/2 -translate-x-1/2 px-2 py-1 bg-slate-800 text-white text-[10px] rounded opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none">${h.name}</span>
                </button>
            `).join('');

            // Render Tasks
            for (let d = 1; d <= 3; d++) {
                const list = document.getElementById(`day-${d}-list`);
                const tasks = state.tasks.filter(t => t.day === d);
                
                if (d === 1) {
                    // Big tiles for Today
                    list.innerHTML = tasks.map(t => `
                        <div onclick="toggleTask(${t.id})" class="task-enter bg-white p-6 rounded-4xl border-2 ${t.completed ? 'border-transparent opacity-60' : t.focus ? 'border-indigo-100 shadow-lg' : 'border-white'} cursor-pointer transition-all hover:scale-[1.02] active:scale-95 group relative overflow-hidden">
                            ${t.focus ? '<div class="absolute top-0 right-0 p-2"><i data-lucide="star" class="fill-amber-400 text-amber-400 w-4 h-4"></i></div>' : ''}
                            <div class="flex items-center gap-4">
                                <div class="w-6 h-6 rounded-full border-2 border-indigo-500 flex items-center justify-center transition-all ${t.completed ? 'bg-indigo-500' : ''}">
                                    ${t.completed ? '<i data-lucide="check" class="text-white w-4 h-4"></i>' : ''}
                                </div>
                                <span class="text-lg font-bold ${t.completed ? 'line-through text-slate-400' : 'text-slate-800'}">${t.text}</span>
                            </div>
                        </div>
                    `).join('');
                } else {
                    // Slim rows for Side days
                    list.innerHTML = tasks.map(t => `
                        <div onclick="toggleTask(${t.id})" class="task-enter bg-white/40 p-4 rounded-2xl border border-white hover:bg-white transition-all cursor-pointer flex items-center gap-3">
                            <div class="w-4 h-4 rounded-full border-2 border-slate-300 flex items-center justify-center ${t.completed ? 'bg-slate-400 border-slate-400' : ''}">
                                ${t.completed ? '<i data-lucide="check" class="text-white w-2 h-2"></i>' : ''}
                            </div>
                            <span class="text-sm font-bold ${t.completed ? 'line-through text-slate-400' : 'text-slate-700'}">${t.text}</span>
                        </div>
                    `).join('');
                }
            }

            // Update Progress
            const todayTasks = state.tasks.filter(t => t.day === 1);
            const completed = todayTasks.filter(t => t.completed).length;
            const progress = todayTasks.length ? (completed / todayTasks.length) * 100 : 0;
            document.getElementById('today-progress').style.width = `${progress}%`;

            lucide.createIcons();
        }

        function toggleTask(id) {
            const task = state.tasks.find(t => t.id === id);
            task.completed = !task.completed;
            render();
        }

        function toggleHabit(id) {
            const habit = state.habits.find(h => h.id === id);
            habit.done = !habit.done;
            render();
        }

        function addTask(day) {
            let text = "";
            if (day === 1) {
                text = document.getElementById('today-input').value;
                document.getElementById('today-input').value = "";
            } else {
                text = prompt("Нове завдання:");
            }
            
            if (text) {
                state.tasks.push({
                    id: Date.now(),
                    day: day,
                    text: text,
                    completed: false,
                    focus: false
                });
                render();
            }
        }

        render();
    </script>
</body>
</html>
